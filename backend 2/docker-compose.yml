# Only the FastAPI backend runs in Docker. The database is Supabase (hosted).
services:
  backend:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
